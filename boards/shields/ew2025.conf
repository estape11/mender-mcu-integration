CONFIG_WIFI=n

# W5500 Ethernet
CONFIG_SPI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_W5500=y
CONFIG_ETH_W5500_TIMEOUT=1000
CONFIG_NET_MGMT=y

# Mender
CONFIG_MENDER_ARTIFACT_NAME="smile"
CONFIG_MENDER_SERVER_HOST_US=y
CONFIG_MENDER_SERVER_TENANT_TOKEN="YOUR_TENANT"
CONFIG_MENDER_SCHEDULER_SEPARATE_WORK_QUEUE=n
CONFIG_MENDER_CLIENT_UPDATE_POLL_INTERVAL=60
CONFIG_MENDER_CLIENT_INVENTORY_REFRESH_INTERVAL=300

# LEDs
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Unique identifiers
CONFIG_HWINFO=y
CONFIG_HWINFO_ESP32=y